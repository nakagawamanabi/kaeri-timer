<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f8fb"><title>かえりの じゅんびタイマー</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#21344a;background:#f4f8fb}*{box-sizing:border-box}body{margin:0}main{height:100dvh;min-height:0;padding:clamp(6px,1.2vh,14px) clamp(10px,2vw,24px);display:flex;flex-direction:column;gap:clamp(5px,1vh,12px);overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}h1{font-size:clamp(20px,4.4vh,38px);margin:0;letter-spacing:.04em}.sub{font-size:clamp(11px,1.9vh,16px);color:#60758b;font-weight:700}.timer{flex:1;min-height:0;border-radius:22px;background:#fff;box-shadow:0 4px 20px #214d7210;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(8px,1.6vh,16px);gap:clamp(4px,1vh,12px)}.clock{font-variant-numeric:tabular-nums;font-size:clamp(65px,18vh,155px);font-weight:850;line-height:1;letter-spacing:.01em}.progress{width:min(94%,920px);height:clamp(12px,2.7vh,24px);background:#e5edf3;border-radius:99px;overflow:hidden}.fill{height:100%;width:100%;background:#4b9fd5;border-radius:99px;transition:width .12s linear}.status{font-size:clamp(14px,2.5vh,24px);font-weight:750;color:#45647c;min-height:1.4em}.items{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(5px,1vw,14px);flex-shrink:0;max-height:29vh}.item{background:#fff;border:2px solid #e0ebf3;border-radius:16px;padding:clamp(3px,.8vh,9px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0}.item svg{width:clamp(35px,8.5vh,77px);height:clamp(35px,8.5vh,77px);flex-shrink:1}.item span{font-size:clamp(10px,2.2vh,20px);font-weight:800;white-space:nowrap}.controls{display:flex;justify-content:center;align-items:center;gap:clamp(5px,1vw,12px);flex-shrink:0;flex-wrap:nowrap}.controls button{border:0;border-radius:14px;min-height:clamp(39px,7.2vh,60px);padding:0 clamp(10px,1.8vw,25px);font:inherit;font-size:clamp(12px,2.4vh,20px);font-weight:800;cursor:pointer;white-space:nowrap;background:#e5edf5;color:#243c52;touch-action:manipulation}.controls button.primary{background:#2387c4;color:white;min-width:clamp(90px,14vw,160px)}.controls button:disabled{opacity:.5}.controls .small{padding-inline:clamp(8px,1.5vw,18px)}.footer{display:flex;align-items:center;justify-content:center;gap:10px;flex-shrink:0;font-size:clamp(10px,1.6vh,14px);color:#60758b}.footer button{border:0;background:transparent;text-decoration:underline;color:#45647c;font:inherit;cursor:pointer}.done .timer{background:#eaf8ee}.done .clock{font-size:clamp(43px,11vh,100px);color:#217a4a}.done .fill{background:#51ad72}.done .status{color:#217a4a}@media(max-width:600px){main{padding:7px;gap:5px}.item{border-radius:10px}.controls button{padding-inline:7px}.item span{font-size:clamp(9px,2vh,14px)}}@media(max-height:460px){main{gap:4px}.items{max-height:24vh}.item svg{height:clamp(26px,7vh,45px);width:clamp(26px,7vh,45px)}.item span{font-size:clamp(9px,2.2vh,14px)}.clock{font-size:clamp(55px,16vh,95px)}.timer{border-radius:12px}.footer{display:none}}
</style></head><body><main id="app"><header><h1>🎒 かえりの じゅんび</h1><span class="sub">じぶんで かくにん！</span></header><section class="timer" aria-live="polite"><div class="clock" id="clock">05:00</div><div class="progress"><div class="fill" id="fill"></div></div><div class="status" id="status">じゅんびが できたら すわろう</div></section><section class="items" aria-label="持ち物チェック">
<div class="item"><svg viewBox="0 0 100 100" role="img" aria-label="ランドセル"><rect x="21" y="28" width="58" height="61" rx="12" fill="#db6d64" stroke="#8f3d3c" stroke-width="4"/><path d="M31 31V22q0-14 19-14t19 14v9" fill="none" stroke="#8f3d3c" stroke-width="7"/><path d="M22 48q28-15 56 0v18H22Z" fill="#f5b6a6" stroke="#8f3d3c" stroke-width="3"/><rect x="45" y="61" width="10" height="12" rx="3" fill="#f4d46e"/></svg><span>ランドセル</span></div>
<div class="item"><svg viewBox="0 0 100 100" role="img" aria-label="水筒"><rect x="34" y="20" width="33" height="68" rx="9" fill="#69b8d3" stroke="#27718b" stroke-width="4"/><rect x="38" y="11" width="25" height="14" rx="4" fill="#27718b"/><path d="M34 32Q16 33 20 64" fill="none" stroke="#27718b" stroke-width="6"/><path d="M45 48h12" stroke="white" stroke-width="5" stroke-linecap="round"/></svg><span>水とう</span></div>
<div class="item"><svg viewBox="0 0 100 100" role="img" aria-label="赤白帽子"><path d="M17 66q3-44 33-44t33 44Z" fill="#f8f8f8" stroke="#b4bbc1" stroke-width="3"/><path d="M17 66q3-44 33-44v44Z" fill="#e95757"/><path d="M17 66h66q10 4 5 13H13q-5-9 4-13" fill="#f3e7dc" stroke="#b4bbc1" stroke-width="3"/><path d="M50 23v42" stroke="#b4bbc1" stroke-width="2"/></svg><span>赤白ぼうし</span></div>
<div class="item"><svg viewBox="0 0 100 100" role="img" aria-label="上靴"><path d="M13 64q7-14 22-10l15 9q12 4 33 2l5 14q-4 10-20 10H25q-17 0-12-25Z" fill="#f8fafc" stroke="#8095a8" stroke-width="4"/><path d="M35 55q8 4 11 13" stroke="#4a99cf" stroke-width="8"/><path d="M14 78h72" stroke="#4a99cf" stroke-width="5"/></svg><span>上ぐつ</span></div>
<div class="item"><svg viewBox="0 0 100 100" role="img" aria-label="きれいな引き出し"><rect x="12" y="22" width="76" height="64" rx="6" fill="#d9ad79" stroke="#8d6743" stroke-width="4"/><rect x="20" y="30" width="60" height="47" rx="3" fill="#fff9e9" stroke="#8d6743" stroke-width="2"/><rect x="25" y="36" width="23" height="31" rx="2" fill="#86b5d7"/><rect x="53" y="36" width="21" height="10" rx="2" fill="#ebc665"/><rect x="53" y="51" width="21" height="16" rx="2" fill="#9fc999"/><path d="m76 18 5 5 10-12" fill="none" stroke="#3b9a5e" stroke-width="5" stroke-linecap="round"/></svg><span>引き出し</span></div>
</section><nav class="controls" aria-label="タイマー操作"><button class="small" id="minus">−1分</button><button class="small" id="plus">＋1分</button><button class="primary" id="start">▶ スタート</button><button id="pause">Ⅱ 一時停止</button><button id="reset">↺ リセット</button></nav><div class="footer"><span>時間：1〜30分まで調整できます</span><button id="preview">♪ チャイム試聴</button></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let duration=300,remaining=300,running=false,deadline=0,raf=0,finished=false,audio=null;const format=t=>{let s=Math.ceil(Math.max(0,t));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};function draw(){ $('clock').textContent=finished?'さようなら！':format(remaining);$('fill').style.width=(finished?100:Math.max(0,remaining/duration*100))+'%';$('app').classList.toggle('done',finished);$('status').textContent=finished?'チャイムが なったら あいさつ！':running?'のこり時間を みて じゅんびしよう':'じゅんびが できたら すわろう';$('start').textContent=running?'▶ スタート中':'▶ スタート';$('start').disabled=running;$('pause').disabled=!running;$('minus').disabled=running;$('plus').disabled=running;}function stop(){running=false;cancelAnimationFrame(raf);}function tick(){if(!running)return;remaining=Math.max(0,(deadline-performance.now())/1000);if(remaining<=0){stop();finished=true;draw();playChime();return}draw();raf=requestAnimationFrame(tick)}function initAudio(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();}catch(e){audio=null}}function bell(freq,start,dur){if(!audio)return;const partials=[1,2,3.01,4.2];partials.forEach((p,i)=>{const osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.value=freq*p;let t=audio.currentTime+start;gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime([.12,.035,.012,.005][i],t+.03);gain.gain.exponentialRampToValueAtTime(.0001,t+dur);osc.connect(gain).connect(audio.destination);osc.start(t);osc.stop(t+dur+.05)})}function playChime(){initAudio();if(!audio)return; // familiar Westminster-style four-tone school chime, approximately 9 seconds
const seq=[659.25,523.25,587.33,392,392,587.33,659.25,523.25];const at=[0,1,2,3,4.7,5.7,6.7,7.7];seq.forEach((f,i)=>bell(f,at[i],i===3||i===7?1.8:1.35));}function adjust(n){if(running)return;duration=Math.min(1800,Math.max(60,duration+n*60));remaining=duration;finished=false;draw()}$('minus').onclick=()=>adjust(-1);$('plus').onclick=()=>adjust(1);$('start').onclick=()=>{initAudio();if(running)return;if(finished){remaining=duration;finished=false}running=true;deadline=performance.now()+remaining*1000;tick()};$('pause').onclick=()=>{if(!running)return;remaining=Math.max(0,(deadline-performance.now())/1000);stop();draw()};$('reset').onclick=()=>{stop();remaining=duration;finished=false;draw()};$('preview').onclick=()=>playChime();document.addEventListener('visibilitychange',()=>{if(running&&document.visibilityState==='visible')tick()});draw();})();
</script></body></html>
